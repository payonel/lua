name: lungoluacpp

on:
  push:
    branches: ['lua-c\+\+']
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          server-id: github

      - name: Install the toolchain
        run: sudo apt-get update && sudo apt-get install -y g++-14 lld time libreadline-dev

      - name: Build and test the release build
        run: |
          make -j"$(nproc)" CXX=g++-14 ARCH=-march=x86-64-v2
          make test CXX=g++-14 ARCH=-march=x86-64-v2

      - name: Make the packages
        run: |
          version="1.0.0-${GITHUB_SHA::8}"
          make -j"$(nproc)" package CXX=g++-14 ARCH=-march=x86-64-v2 PKG_VERSION="$version"
          make -j"$(nproc)" package-debug CXX=g++-14 ARCH=-march=x86-64-v2 PKG_VERSION="$version"

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="1.0.0-${GITHUB_SHA::8}"
          for artifact in lungoluacpp lungoluacpp-tests; do
            mvn --batch-mode org.apache.maven.plugins:maven-deploy-plugin:3.1.2:deploy-file \
              -DgroupId=com.payonel -DartifactId="$artifact" -Dversion="$version" -Dpackaging=tar.gz \
              -Dfile="$artifact-$version.tar.gz" \
              -DrepositoryId=github -Durl=https://maven.pkg.github.com/payonel/lua
            echo "Published com.payonel:$artifact:$version" >> "$GITHUB_STEP_SUMMARY"
          done
